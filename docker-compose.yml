services:
  node_exporter:
    image: prom/node-exporter:latest
    expose:
      - 9100
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"
    pid: host
    networks:
      monitor-network:
        aliases:
          - node_exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    expose:
      - 8080
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - '-housekeeping_interval=10s'
      - '-docker_only=true'
    networks:
      monitor-network:
        aliases:
          - cadvisor

  prometheus:
    image: prom/prometheus:latest
    expose:
      - 9090
    restart: unless-stopped
    volumes:
        - "./prometheus.yml:/etc/prometheus/prometheus.yml"
        - prometheus-storage:/prometheus
    command:
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      monitor-network:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      monitor-network:
        aliases:
          - grafana

  loki:
    image: grafana/loki:latest
    expose:
      - 3100
    restart: unless-stopped
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      monitor-network:
        aliases:
          - loki


  api-gateway-loki:
    image: nginx:stable-alpine
    ports:
      - ${LOKI_PORT}:3100
    restart: unless-stopped
    volumes:
      - ./api-gateway/nginx-loki.conf:/etc/nginx/conf.d/default.conf
      - ./api-gateway/.htpasswd:/etc/nginx/.htpasswd
    env_file:
      - ./.env
    networks:
      monitor-network:
        aliases:
          - api-gateway

# Network
networks:
  monitor-network:
    driver: bridge

# Volumes
volumes:
  prometheus-storage:
    driver: local
    driver_opts:
      type: none
      device: ./data/prometheus
      o: bind
  grafana-storage:
    driver: local
    driver_opts:
      type: none
      device: ./data/grafana
      o: bind

